<!DOCTYPE html>

<head>

<title>劃火柴 — 陳曉東粵語作品 Credits</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F0E8;--bg-card:#FDFBF7;--bg-card-hover:#FAF6EE;
  --text-primary:#3D3228;--text-secondary:#7A6E62;--text-muted:#A89B8C;
  --accent:#C4A265;--accent-light:#E8D5B0;--accent-subtle:#F0E6D2;
  --border:#E5DDD0;--border-light:#EDE7DB;
  --tag-lyrics:#C4A265;--tag-compose:#9B8A6E;--tag-arrange:#7A8B6E;--tag-produce:#6E7E8B;
  --radius:10px
}
html{font-size:16px}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;min-height:100dvh;-webkit-font-smoothing:antialiased}
#root{max-width:480px;margin:0 auto;padding-bottom:80px}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--bg) 85%,transparent);padding:16px 16px 12px}
.header-title{font-family:'Noto Serif TC',serif;font-size:1.35rem;font-weight:700;letter-spacing:.03em;margin-bottom:10px}
.header-subtitle{font-size:.75rem;color:var(--text-muted);font-weight:300;margin-top:2px}
.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-size:.9rem;font-family:inherit;color:var(--text-primary);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.9rem;pointer-events:none}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer;padding:4px;display:none}
.search-clear.show{display:block}
.tabs{display:flex;gap:0;background:var(--bg-card);border-radius:var(--radius);padding:3px;border:1px solid var(--border-light)}
.tab{flex:1;padding:8px 0;text-align:center;font-size:.78rem;font-weight:500;color:var(--text-secondary);border:none;background:transparent;border-radius:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.tab.active{background:var(--accent);color:#fff;font-weight:600}
.content{padding:0 16px;margin-top:8px}
.album-group{margin-bottom:12px}
.album-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none}
.album-header:active{background:var(--bg-card-hover)}
.album-year{font-family:'Noto Serif TC',serif;font-size:.78rem;color:var(--accent);font-weight:600;min-width:36px}
.album-name{flex:1;font-weight:600;font-size:.92rem}
.album-count{font-size:.75rem;color:var(--text-muted)}
.album-chevron{font-size:.7rem;color:var(--text-muted);transition:transform .2s}
.album-chevron.open{transform:rotate(90deg)}
.album-songs{overflow:hidden;transition:max-height .3s ease;max-height:0}
.album-songs.open{max-height:5000px}
.album-songs-inner{padding:4px 0}
.song-item{border-left:2px solid var(--border-light);margin-left:24px}
.song-header{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;cursor:pointer;transition:background .15s;-webkit-user-select:none;user-select:none}
.song-header:active{background:var(--accent-subtle)}
.song-name{flex:1;font-size:.88rem;font-weight:400}
.song-badge{font-size:.65rem;color:var(--accent);background:var(--accent-subtle);padding:2px 6px;border-radius:3px;white-space:nowrap}
.song-chevron{font-size:.6rem;color:var(--text-muted);transition:transform .2s}
.song-chevron.open{transform:rotate(90deg)}
.song-detail{overflow:hidden;max-height:0;transition:max-height .25s ease}
.song-detail.open{max-height:400px}
.song-detail-inner{padding:4px 14px 14px 14px}
.credit-row{display:flex;align-items:baseline;padding:4px 0;font-size:.82rem;gap:8px}
.credit-label{color:var(--text-muted);min-width:32px;font-size:.75rem;flex-shrink:0}
.credit-value{color:var(--text-primary)}
.credit-name-link{color:var(--text-primary);text-decoration:none;border-bottom:1px dotted var(--accent-light);cursor:pointer;transition:color .15s,border-color .15s}
.credit-name-link:active{color:var(--accent);border-color:var(--accent)}
.song-note{margin-top:6px;font-size:.75rem;color:var(--text-muted);font-style:italic;padding-left:40px}
.person-item{padding:12px 14px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none}
.person-item:active{background:var(--bg-card-hover)}
.person-name{font-weight:600;font-size:.92rem;margin-bottom:4px}
.person-roles{display:flex;flex-wrap:wrap;gap:4px}
.role-tag{font-size:.7rem;padding:2px 7px;border-radius:3px;font-weight:500;color:#fff}
.role-tag.lyrics{background:var(--tag-lyrics)}
.role-tag.compose{background:var(--tag-compose)}
.role-tag.arrange{background:var(--tag-arrange)}
.role-tag.produce{background:var(--tag-produce)}
.person-back{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--accent);background:none;border:none;cursor:pointer;padding:8px 0;margin-bottom:4px;font-family:inherit}
.person-detail-name{font-family:'Noto Serif TC',serif;font-size:1.2rem;font-weight:700;margin-bottom:4px}
.person-detail-stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.person-song-group{margin-bottom:14px}
.person-song-group-title{font-size:.78rem;color:var(--text-muted);font-weight:500;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border-light)}
.person-song-entry{border-bottom:1px solid var(--border-light)}
.person-song-entry:last-child{border-bottom:none}
.pse-header{display:flex;align-items:center;gap:6px;padding:8px 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.pse-header:active{opacity:.7}
.pse-title{flex:1;font-size:.88rem;font-weight:500}
.pse-chevron{font-size:.55rem;color:var(--text-muted);transition:transform .2s}
.pse-chevron.open{transform:rotate(90deg)}
.pse-detail{overflow:hidden;max-height:0;transition:max-height .25s ease}
.pse-detail.open{max-height:300px}
.pse-detail-inner{padding:0 0 8px 0}
.role-tag-sm{font-size:.6rem;padding:1px 5px;border-radius:2px;font-weight:500;color:#fff}
.role-tag-sm.lyrics{background:var(--tag-lyrics)}
.role-tag-sm.compose{background:var(--tag-compose)}
.role-tag-sm.arrange{background:var(--tag-arrange)}
.role-tag-sm.produce{background:var(--tag-produce)}
.search-results-label{font-size:.78rem;color:var(--text-muted);padding:4px 0 8px}
.search-song-item{padding:10px 14px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);margin-bottom:8px}
.search-song-name{font-weight:600;font-size:.9rem;margin-bottom:2px}
.search-song-album{font-size:.75rem;color:var(--text-secondary);margin-bottom:6px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.88rem}
.sort-toggle{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:4px 0 8px}
.sort-btn{font-size:.72rem;color:var(--text-muted);background:none;border:1px solid var(--border-light);border-radius:4px;padding:3px 8px;cursor:pointer;font-family:inherit;transition:all .15s}
.sort-btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-subtle)}

/* Cross query */
.cross-section{margin-bottom:14px}
.cross-label{font-size:.78rem;color:var(--text-muted);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.cross-label-sel{font-size:.78rem;color:var(--accent);font-weight:600}
.chip-pool{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius)}
.chip{padding:5px 10px;border-radius:20px;font-size:.76rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .15s;font-family:inherit;-webkit-user-select:none;user-select:none;white-space:nowrap}
.chip:active{transform:scale(.96)}
.chip.sel-lyrics{background:var(--tag-lyrics);color:#fff;border-color:var(--tag-lyrics)}
.chip.sel-compose{background:var(--tag-compose);color:#fff;border-color:var(--tag-compose)}
.chip .chip-count{font-size:.65rem;opacity:.7;margin-left:2px}
.chip-others{border-style:dashed;color:var(--text-muted)}
.chip-others-open{background:var(--accent-subtle);border-style:solid;color:var(--text-secondary)}
.cross-divider{height:1px;background:var(--border-light);margin:4px 0 14px}
.cross-results-header{font-size:.82rem;color:var(--text-secondary);padding:8px 0;font-weight:500}
.cross-result-item{padding:10px 14px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;-webkit-user-select:none;user-select:none}
.cross-result-item:active{background:var(--bg-card-hover)}
.cross-song-name{font-weight:600;font-size:.9rem;margin-bottom:2px}
.cross-song-album{font-size:.75rem;color:var(--text-secondary)}
.cross-detail{overflow:hidden;max-height:0;transition:max-height .25s ease}
.cross-detail.open{max-height:300px}
.cross-hint{text-align:center;padding:30px 20px;color:var(--text-muted);font-size:.82rem;line-height:1.8}
</style>
</head>

const {useState,useMemo,useCallback,useRef,useEffect}=React;
const e=React.createElement;

function parseNames(str){
  if(!str)return[];
  return str.split(/[、\/,，]/).map(s=>s.trim()).filter(Boolean).map(canonName);
}

function buildRoleIndex(data,field){
  const map={};
  data.forEach(song=>{
    parseNames(song[field]).forEach(name=>{
      if(!map[name])map[name]={name,count:0,songs:[]};
      map[name].count++;
      map[name].songs.push(song);
    });
  });
  return Object.values(map).sort((a,b)=>b.count-a.count);
}

function buildAlbumGroups(data){
  const map={};
  data.forEach(song=>{
    const k=song.專輯;
    if(!map[k])map[k]={album:song.專輯,minYear:song.年份,maxYear:song.年份,songs:[]};
    map[k].songs.push(song);
    if(song.年份<map[k].minYear)map[k].minYear=song.年份;
    if(song.年份>map[k].maxYear)map[k].maxYear=song.年份;
  });
  return Object.values(map)
    .map(g=>({...g,yearLabel:g.minYear===g.maxYear?String(g.minYear):g.minYear+'–'+g.maxYear}))
    .sort((a,b)=>b.maxYear-a.maxYear||b.minYear-a.minYear);
}

const ROLE_LABELS={lyrics:'填詞',compose:'作曲',arrange:'編曲',produce:'監製'};

function RoleTag({roleKey,count,small}){
  const cls=small?'role-tag-sm':'role-tag';
  const label=ROLE_LABELS[roleKey]+(count!=null?' ×'+count:'');
  return e('span',{className:cls+' '+roleKey},label);
}

function CreditRow({label,value,onNameClick}){
  if(!value)return null;
  const names=parseNames(value);
  const parts=names.map((n,i)=>[
    e('span',{key:i,className:'credit-name-link',onClick:ev=>{ev.stopPropagation();onNameClick(n);}},n),
    i<names.length-1?'、':''
  ]).flat();
  return e('div',{className:'credit-row'},
    e('span',{className:'credit-label'},label),
    e('span',{className:'credit-value'},...parts)
  );
}

function SongDetail({song,onNameClick}){
  return e('div',{className:'song-detail-inner'},
    e(CreditRow,{label:'詞',value:song.填詞,onNameClick}),
    e(CreditRow,{label:'曲',value:song.作曲,onNameClick}),
    e(CreditRow,{label:'編',value:song.編曲,onNameClick}),
    e(CreditRow,{label:'監',value:song.監製,onNameClick}),
    song.備註?e('div',{className:'song-note'},song.備註):null

}

      e('span',{className:'album-count'},group.songs.length+'首'),

    e('div',{className:'album-songs'+(open?' open':'')},
      open?e('div',{className:'album-songs-inner'},

function AlbumView({albums,onNameClick,searchQ}){
  if(searchQ){
    const filtered=albums.map(g=>({
      ...g,songs:g.songs.filter(s=>fuzzyMatch(s.歌曲名稱,searchQ))
    })).filter(g=>g.songs.length>0);
    if(!filtered.length)return e('div',{className:'empty-state'},'沒有找到相關歌曲');
    return e('div',null,filtered.map((g,i)=>e(AlbumGroup,{key:i,group:g,onNameClick,forceOpen:true})));
  }
  return e('div',null,albums.map((g,i)=>e(AlbumGroup,{key:i,group:g,onNameClick})));
}

function PersonList({persons,onSelect,searchQ,sortBy,onSortChange,roleKey}){
  let list=persons;
  if(searchQ) list=persons.filter(p=>fuzzyMatch(p.name,searchQ));
  if(sortBy==='alpha') list=[...list].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  if(!list.length)return e('div',{className:'empty-state'},'沒有找到相關人名');
  return e('div',null,
    e('div',{className:'sort-toggle'},
      e('button',{className:'sort-btn'+(sortBy==='count'?' active':''),onClick:()=>onSortChange('count')},'按作品數'),
      e('button',{className:'sort-btn'+(sortBy==='alpha'?' active':''),onClick:()=>onSortChange('alpha')},'按名稱')
    ),
    e('div',null,
      list.map((p,i)=>e('div',{key:i,className:'person-item',onClick:()=>onSelect(p)},
        e('div',{className:'person-name'},p.name),
        e('div',{className:'person-roles'},e(RoleTag,{roleKey,count:p.count}))
      ))
    )
  );
}

function PersonDetailPage({person,onBack,onNameClick,roleKey}){
  const albumMap={};
  person.songs.forEach(song=>{
    const k=song.專輯;
    if(!albumMap[k])albumMap[k]={label:song.專輯,year:song.年份,maxYear:song.年份,songs:new Map()};
    if(song.年份>albumMap[k].maxYear)albumMap[k].maxYear=song.年份;
    if(song.年份<albumMap[k].year)albumMap[k].year=song.年份;
    const existing=albumMap[k].songs.get(song.歌曲名稱);
    if(existing){if(!existing.roles.includes(roleKey))existing.roles.push(roleKey);}
    else albumMap[k].songs.set(song.歌曲名稱,{song,roles:[roleKey]});
  });
  const albumGroups=Object.values(albumMap).sort((a,b)=>b.maxYear-a.maxYear);
  return e('div',null,
    e('button',{className:'person-back',onClick:onBack},'‹ 返回'),
    e('div',{className:'person-detail-name'},person.name),
    e('div',{className:'person-detail-stats'},e(RoleTag,{roleKey,count:person.count})),
    albumGroups.map((ag,i)=>{
      const yl=ag.year===ag.maxYear?String(ag.year):ag.year+'–'+ag.maxYear;
      return e('div',{key:i,className:'person-song-group'},
        e('div',{className:'person-song-group-title'},ag.label+' ('+yl+')'),
        Array.from(ag.songs.values()).map((entry,j)=>
          e(PersonSongEntry,{key:j,song:entry.song,roles:entry.roles,onNameClick})
        )
      );
    })
  );
}

function ChipPool({persons,selected,onSelect,selClass}){
  const main=persons.filter(p=>p.count>1);
  const others=persons.filter(p=>p.count===1);
  const[showOthers,setShowOthers]=useState(false);
  // If selected person is in "others", force show
  const forceShow=others.some(p=>p.name===selected);
  const othersVisible=showOthers||forceShow;
  return e('div',{className:'chip-pool'},
    main.map(p=>e('button',{
      key:p.name,
      className:'chip'+(selected===p.name?' '+selClass:''),
      onClick:()=>onSelect(selected===p.name?'':p.name)
    },p.name,e('span',{className:'chip-count'},p.count))),
    others.length>0?e('button',{
      key:'__others',
      className:'chip chip-others'+(othersVisible?' chip-others-open':''),
      onClick:()=>setShowOthers(!showOthers)
    },'其他',e('span',{className:'chip-count'},others.length)):null,
    othersVisible?others.map(p=>e('button',{
      key:p.name,
      className:'chip'+(selected===p.name?' '+selClass:''),
      onClick:()=>onSelect(selected===p.name?'':p.name)
    },p.name)):null
  );
}

function CrossQueryView({data,lyricists,composers,onNameClick}){
  const[selLyricist,setSelLyricist]=useState('');
  const[selComposer,setSelComposer]=useState('');

  const results=useMemo(()=>{
    if(!selLyricist&&!selComposer)return null;
    return data.filter(song=>{
      const lOk=!selLyricist||parseNames(song.填詞).includes(selLyricist);
      const cOk=!selComposer||parseNames(song.作曲).includes(selComposer);
      return lOk&&cOk;
    });
  },[selLyricist,selComposer,data]);

  return e('div',null,
    e('div',{className:'cross-section'},
      e('div',{className:'cross-label'},'填詞',
        selLyricist?e('span',{className:'cross-label-sel'},' · '+selLyricist):null
      ),
      e(ChipPool,{persons:lyricists,selected:selLyricist,onSelect:setSelLyricist,selClass:'sel-lyrics'})
    ),
    e('div',{className:'cross-section'},
      e('div',{className:'cross-label'},'作曲',
        selComposer?e('span',{className:'cross-label-sel'},' · '+selComposer):null
      ),
      e(ChipPool,{persons:composers,selected:selComposer,onSelect:setSelComposer,selClass:'sel-compose'})
    ),
    e('div',{className:'cross-divider'}),
    results===null?
      e('div',{className:'cross-hint'},'點選填詞人和／或作曲人查看合作作品'):
      results.length===0?
        e('div',{className:'empty-state'},'沒有找到符合條件的作品'):
        e('div',null,
          e('div',{className:'cross-results-header'},
            (selLyricist&&selComposer?selLyricist+' × '+selComposer:selLyricist||selComposer)+' · '+results.length+' 首'
          ),
          results.map((song,i)=>e(CrossResultItem,{key:i,song,onNameClick}))
        )
  );
}

function SearchResults({data,query,onNameClick}){
  if(!query)return null;
  const songResults=data.filter(s=>fuzzyMatch(s.歌曲名稱,query)||fuzzyMatch(s.備註,query));
  const creditResults=data.filter(s=>
    !songResults.includes(s)&&(
      fuzzyMatch(s.填詞,query)||fuzzyMatch(s.作曲,query)||
      fuzzyMatch(s.編曲,query)||fuzzyMatch(s.監製,query)
    )
  );
  const all=[...songResults,...creditResults];
  if(!all.length)return e('div',{className:'empty-state'},'沒有找到「'+query+'」的結果');
  return e('div',null,
    e('div',{className:'search-results-label'},'找到 '+all.length+' 個結果'),
    all.map((song,i)=>e('div',{key:i,className:'search-song-item'},
      e('div',{className:'search-song-name'},song.歌曲名稱),
      e('div',{className:'search-song-album'},song.專輯+' ('+song.年份+')'),
      e(SongDetail,{song,onNameClick})
    ))
  );
}

function App(){
  const[tab,setTab]=useState('album');
  const[search,setSearch]=useState('');
  const[selectedPerson,setSelectedPerson]=useState(null);
  const[personSort,setPersonSort]=useState('count');

  const albums=useMemo(()=>buildAlbumGroups(DATA),[]);
  const lyricists=useMemo(()=>buildRoleIndex(DATA,'填詞'),[]);
  const composers=useMemo(()=>buildRoleIndex(DATA,'作曲'),[]);

  const lyricistMap=useMemo(()=>{const m={};lyricists.forEach(p=>m[p.name]=p);return m},[lyricists]);
  const composerMap=useMemo(()=>{const m={};composers.forEach(p=>m[p.name]=p);return m},[composers]);

  const handleNameClick=useCallback(name=>{
    const cn=canonName(name);
    if(lyricistMap[cn]){setSelectedPerson(lyricistMap[cn]);setTab('lyrics');setSearch('');window.scrollTo(0,0);}
    else if(composerMap[cn]){setSelectedPerson(composerMap[cn]);setTab('compose');setSearch('');window.scrollTo(0,0);}
  },[lyricistMap,composerMap]);

  const isSearching=search.length>0;
  const roleKeyForTab=tab==='lyrics'?'lyrics':'compose';

  const header=e('div',{className:'header'},
    e('div',{className:'header-title'},'劃火柴',
      e('div',{className:'header-subtitle'},'121 首 · 1995–2026')
    ),
    e('div',{className:'search-wrap'},
      e('span',{className:'search-icon'},'🔍'),
      e('input',{className:'search-input',placeholder:'搜索歌名、人名…',value:search,
        onChange:ev=>setSearch(ev.target.value)}),
      e('button',{className:'search-clear'+(search?' show':''),onClick:()=>setSearch('')},'✕')
    ),
    e('div',{className:'tabs'},
      e('button',{className:'tab'+(tab==='album'?' active':''),onClick:()=>{setTab('album');setSelectedPerson(null)}},'按專輯'),
      e('button',{className:'tab'+(tab==='lyrics'?' active':''),onClick:()=>{setTab('lyrics');setSelectedPerson(null)}},'按填詞'),
      e('button',{className:'tab'+(tab==='compose'?' active':''),onClick:()=>{setTab('compose');setSelectedPerson(null)}},'按作曲'),
      e('button',{className:'tab'+(tab==='cross'?' active':''),onClick:()=>{setTab('cross');setSelectedPerson(null)}},'交叉查詢')
    )
  );

  if((tab==='lyrics'||tab==='compose')&&selectedPerson&&!isSearching){
    return e('div',null,header,
      e('div',{className:'content'},
        e(PersonDetailPage,{person:selectedPerson,onBack:()=>setSelectedPerson(null),onNameClick:handleNameClick,roleKey:roleKeyForTab})
      )
    );
  }

  let content;
  if(isSearching){
    content=e(SearchResults,{data:DATA,query:search,onNameClick:handleNameClick});
  }else if(tab==='album'){
    content=e(AlbumView,{albums,onNameClick:handleNameClick,searchQ:''});
  }else if(tab==='lyrics'){
    content=e(PersonList,{persons:lyricists,onSelect:setSelectedPerson,searchQ:'',sortBy:personSort,onSortChange:setPersonSort,roleKey:'lyrics'});
  }else if(tab==='compose'){
    content=e(PersonList,{persons:composers,onSelect:setSelectedPerson,searchQ:'',sortBy:personSort,onSortChange:setPersonSort,roleKey:'compose'});
  }else{
    content=e(CrossQueryView,{data:DATA,lyricists,composers,onNameClick:handleNameClick});
  }

  return e('div',null,header,e('div',{className:'content'},content));
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));

</script>
<script>
if('serviceWorker' in navigator){
  const SW_VERSION='v6';
  navigator.serviceWorker.register('sw.js?v='+SW_VERSION).then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;
      if(w) w.addEventListener('statechange',()=>{
        if(w.state==='activated') location.reload();
      });
    });
  });
}
</script>
</body>
</html>
